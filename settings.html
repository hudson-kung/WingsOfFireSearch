<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Settings · Wings of Fire Search</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap');
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; color: #ffe9a6; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #160d13 url('assets/backgrounds/darkstalker.png') center / cover fixed; }
      main { min-height: 100vh; margin-left: 240px; padding: clamp(3rem, 8vw, 5rem) clamp(1.25rem, 8vw, 7rem); }
      .settings-layout { max-width: 760px; }
      .sidebar { position: fixed; z-index: 2; inset: 0 auto 0 0; width: 240px; overflow: auto; padding: 1.5rem .8rem; border-right: 1px solid #8d6716; background: #160d13; box-shadow: 5px 0 20px rgba(0,0,0,.35); }
      .sidebar-title { display: block; padding: 1rem .75rem .85rem; color: #e7ca7a; font-size: .75rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
      .sidebar a { display: block; margin: .25rem 0; padding: .8rem .75rem; border-radius: .45rem; color: #ffe9a6; text-decoration: none; font-weight: 700; }
      .sidebar a:last-child { margin-bottom: .7rem; }
      .sidebar a:hover { background: #4d3511; }.sidebar a[aria-current="page"] { background: #f9c64a; color: #241608; }
      .content { min-width: 0; }
      h1 { margin: 0; font-family: 'Cinzel', Georgia, serif; font-size: clamp(2.25rem, 6vw, 3.75rem); color: #f9c64a; text-shadow: 0 2px 0 #63400d, 0 5px 20px #12090c; }
      .intro { margin: .75rem 0 2rem; color: #fff1bd; line-height: 1.5; text-shadow: 0 1px 2px #000; }
      .panel { border: 1px solid #8d6716; border-radius: 1rem; padding: .4rem 1.4rem 1.4rem; background: #160d13; box-shadow: 0 5px 20px rgba(0,0,0,.55); }
      .setting-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; padding: 1.2rem 0; border-top: 1px solid #68480c; }
      .setting-row:first-child { border-top: 0; }
      .setting-row strong, .setting-row small { display: block; }
      .setting-row small { margin-top: .3rem; color: #e7ca7a; font-size: .9rem; line-height: 1.4; }
      .switch { appearance: none; flex: 0 0 auto; width: 2.7rem; height: 1.5rem; margin: .15rem 0 0; border: 0; border-radius: 1rem; background: #777; cursor: pointer; position: relative; transition: background .15s; }
      .switch::after { content: ''; position: absolute; width: 1.08rem; height: 1.08rem; top: .21rem; left: .21rem; border-radius: 50%; background: white; box-shadow: 0 1px 2px rgba(0,0,0,.35); transition: transform .15s; }
      .switch:checked { background: #f9c64a; }.switch:checked::after { transform: translateX(1.2rem); }
      .setting-link { align-self: center; color: #f9c64a; font-weight: 700; }
      .footer { display: flex; justify-content: flex-end; align-items: center; gap: 1rem; margin-top: 1.3rem; }
      button { border: 1px solid #f9c64a; border-radius: .3rem; background: #f9c64a; color: #241608; cursor: pointer; font-size: .95rem; font-weight: 700; padding: .72rem 1.1rem; }
      button:hover { background: #ffe08a; }.saved { min-height: 1.2rem; color: #9ee8a7; font-size: .9rem; margin: 0; }
      @media (max-width: 620px) { main { margin-left: 0; }.sidebar { position: static; width: auto; display: flex; align-items: center; padding: .55rem 1rem; border-right: 0; border-bottom: 1px solid #8d6716; }.sidebar-title { display: none; }.sidebar a, .sidebar a:last-child { margin: 0; flex: 1; text-align: center; }.footer { align-items: flex-end; flex-direction: column; }.saved { min-height: 0; } }
    </style>
  </head>
  <body>
    <main>
      <div class="settings-layout">
        <nav class="sidebar" aria-label="Settings navigation"><span class="sidebar-title">Settings</span><a href="index.html">&lt; Back</a><a href="settings.html" aria-current="page">General</a><a href="backgrounds.html">Backgrounds</a></nav>
        <div class="content">
          <h1>Settings</h1>
          <p class="intro">Choose how Wings of Fire Search handles your searches. Changes are saved on this device.</p>
          <section class="panel" aria-label="Search settings">
            <label class="setting-row"><span><strong>Open results in a new tab</strong><small>Keep Wings of Fire Search open while you browse Google results.</small></span><input class="switch" id="new-tab" type="checkbox" /></label>
            <label class="setting-row"><span><strong>Use Lucky mode by default</strong><small>Go straight to Google's first result whenever available.</small></span><input class="switch" id="lucky-default" type="checkbox" /></label>
            <div class="setting-row"><span><strong>Backgrounds</strong><small>Choose a dragon background for your search page.</small></span><a class="setting-link" href="backgrounds.html">Choose</a></div>
            <div class="footer"><p class="saved" id="saved" aria-live="polite"></p><button id="save-settings" type="button">Save settings</button></div>
          </section>
        </div>
      </div>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
