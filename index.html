<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="SilkSearch sends your query to Google." />
    <title>SilkSearch</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&display=swap');
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #160d13 url('assets/backgrounds/darkstalker.png') center / cover fixed; color: #ffe9a6; }
      .topbar { display: flex; align-items: center; min-height: 72px; padding: .7rem 1rem; background: linear-gradient(90deg, rgba(22,13,19,.96), rgba(39,18,23,.82)); border-bottom: 1px solid rgba(249,198,74,.6); box-shadow: 0 2px 14px rgba(0,0,0,.35); }
      .topbar .home-brand { display: inline-flex; align-items: center; gap: .35rem; color: #f9c64a; font-family: 'Cinzel', Georgia, serif; font-size: clamp(1rem, 3vw, 1.35rem); font-weight: 800; letter-spacing: .01em; text-decoration: none; text-shadow: 0 1px 2px #000; }
      .home-brand img { width: 2.7rem; height: 2.7rem; border-radius: 50%; object-fit: cover; box-shadow: 0 1px 6px rgba(0,0,0,.5); }
      .topbar a { color: #ffe9a6; text-decoration: none; }
      .topbar a:hover { text-decoration: underline; }
      .tab { display: grid; width: 2.65rem; height: 2.65rem; margin-left: auto; place-items: center; border: 1px solid rgba(249,198,74,.7); border-radius: 50%; background: rgba(22,13,19,.82); color: #f9c64a; font-size: 1.2rem; line-height: 1; box-shadow: 0 2px 10px rgba(0,0,0,.35); transition: background .15s, transform .15s; }
      .tab:hover { background: #4d3511; transform: rotate(22deg); }
      main { min-height: calc(100vh - 72px); display: flex; flex-direction: column; align-items: center; padding: clamp(5rem, 16vh, 10rem) 1.25rem 3rem; }
      .brand { margin: 0 0 2rem; font-family: 'Cinzel', Georgia, serif; font-size: clamp(2.8rem, 7vw, 5.25rem); letter-spacing: -.06em; font-weight: 800; line-height: .95; color: #f9c64a; text-shadow: 0 2px 0 #63400d, 0 5px 20px #12090c; }
      .brand span { color: inherit !important; }
      form { width: min(100%, 584px); }
      .field { display: flex; align-items: center; height: 3.1rem; border: 1px solid #f9c64a; border-radius: 1.6rem; padding: 0 .9rem 0 1.1rem; background: #fff7d5; transition: box-shadow .15s, border-color .15s; }
      .field:focus-within, .field:hover { border-color: #fff0a1; box-shadow: 0 1px 12px rgba(0,0,0,.7); }
      .icon { color: #8d6716; width: 1.4rem; height: 1.4rem; flex: 0 0 auto; }
      input { min-width: 0; flex: 1; height: 100%; border: 0; outline: 0; padding: 0 .75rem; background: transparent; font: inherit; font-size: 1rem; font-weight: 700; color: #f9c64a; }
      input::placeholder { color: #f9c64a; font-weight: 700; opacity: 1; }
      .clear { display: none; border: 0; background: none; color: #70757a; cursor: pointer; font-size: 1.35rem; line-height: 1; padding: .2rem .45rem; }
      input:not(:placeholder-shown) + .clear { display: block; }
      .actions { display: flex; justify-content: center; gap: .75rem; margin-top: 1.8rem; flex-wrap: wrap; }
      button { border: 1px solid #f9c64a; border-radius: .25rem; background: #f9c64a; color: #241608; cursor: pointer; font-size: .9rem; font-weight: 700; padding: .7rem 1rem; }
      button:hover { border-color: #fff0a1; background: #ffe08a; box-shadow: 0 1px 5px rgba(0,0,0,.45); }
      .hint { margin-top: 1.7rem; color: #fff1bd; font-size: .82rem; text-align: center; text-shadow: 0 1px 2px #000; }
      .hint a { color: #f9c64a; text-decoration: none; }
      .hint a:hover { text-decoration: underline; }
      @media (max-width: 460px) { .topbar { padding: 1rem; } main { padding-top: 6.5rem; } .brand { margin-bottom: 1.75rem; } }
    </style>
  </head>
  <body>
    <nav class="topbar" aria-label="Utility navigation">
      <a class="home-brand" href="index.html"><img src="assets/fanwing-crest.png" alt="SilkSearch crest" /><span>SilkSearch</span></a>
      <a class="tab" href="settings.html" aria-label="Open settings" title="Settings">&#9881;</a>
    </nav>
    <main>
      <h1 class="brand" aria-label="SilkSearch">SilkSearch</h1>
      <form id="search-form" action="https://www.google.com/search" method="get">
        <label class="field" for="query">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M9.5 3a6.5 6.5 0 1 0 4.1 11.54l4.43 4.43 1.41-1.41-4.43-4.43A6.5 6.5 0 0 0 9.5 3m0 2a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9"/></svg>
          <input id="query" name="q" type="search" placeholder="Search the Library of Clearsight" autocomplete="off" autofocus />
          <button class="clear" id="clear-search" type="button" aria-label="Clear search">×</button>
        </label>
      </form>
    </main>
    <script src="index.js"></script>
  </body>
</html>
